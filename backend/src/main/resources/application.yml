server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agri_assist?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update：增量建新表/新列（本轮自动创建 trace_record / price_quote），不动已有数据
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

agri:
  jwt:
    secret: "agri-assist-change-me-in-production-please-use-long-random-key"
    expiration: 86400000
  ai:
    # AI 智能咨询模式：local（纯本地检索） / cloud（本地检索+云端生成） / ollama（本地检索+本地模型，当前启用）
    mode: ollama
    ollama:
      base-url: "http://localhost:11434"
      model: "deepseek-r1:1.5b"
      embedding-model: "nomic-embed-text"
    cloud:
      # 腾讯混元 OpenAI 兼容端点；可替换为 DeepSeek、智谱等任意兼容服务
      base-url: "https://api.hunyuan.cloud.tencent.com/v1"
      # API Key 通过环境变量注入，避免明文写入配置文件
      api-key: "${HUNYUAN_API_KEY:}"
      model: "hunyuan-standard"
      chat-path: "/chat/completions"
      temperature: 0.3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
